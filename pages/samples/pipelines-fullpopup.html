<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipelines — Full Page Popup</title>
  <link rel="stylesheet" href="../../zcat-ui/zcat.css?v=120">
  <style>
    /* Page glue only. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--zc-body-bg-body); }
    .pl-empty-region { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: var(--zc-space-24); }
  </style>
</head>
<body data-zcat-sample>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M12 4L4 12M4 4L12 12"/></symbol>
</defs></svg>

<!-- Full Page Popup (Figma 548:9060) with the Empty State component inside -->
<div class="zc-fullpopup">
  <div class="zc-fullpopup__header">
    <span class="zc-fullpopup__service">
      <img src="../../zcat-ui/docs/icons/Pipeline -color.svg" alt="">
      <span class="zc-fullpopup__title">Pipelines</span>
    </span>
    <button class="zc-btn" data-variant="ghost-grey" data-size="small" data-content="icon" data-radius="rounded" type="button" aria-label="Close" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('../directdb/databases.html')">
      <svg class="zc-btn__icon" viewBox="0 0 16 16" fill="none"><use href="#i-x"/></svg>
    </button>
  </div>
  <div class="zc-fullpopup__sheet">
    <div class="pl-empty-region">
      <div class="zc-empty">
        <div class="zc-empty__art"><img src="../../zcat-ui/docs/icons/Empty State Illustration.svg" alt=""></div>
        <div class="zc-empty__content">
          <div class="zc-empty__heading">Create your first pipeline</div>
          <div class="zc-empty__desc">Create your first pipeline to automate the build, test and deploy processes.</div>
        </div>
        <div class="zc-empty__actions">
          <button class="zc-btn" data-variant="fill" data-color="primary" type="button">Create Pipeline</button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
